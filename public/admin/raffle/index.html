<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Raffle drawing | Father&rsquo;s Tool Box</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css?v=2026111701">
<style>
body{background:var(--stone)}
.adm{max-width:760px;margin:0 auto;padding:clamp(2rem,6vw,4rem) 1rem 4rem}
.adm h1{margin:.2rem 0 .3rem;font-size:clamp(2rem,6vw,2.8rem)}
.adm .sub{color:var(--ink-soft);font-style:italic;margin:0 0 1.6rem}
.adm .panel{background:var(--vellum);border:1px solid var(--stone-deep);border-radius:3px;padding:1.4rem 1.5rem;margin:0 0 1.4rem;box-shadow:0 18px 40px -30px rgba(35,31,28,.45)}
.adm form{padding:0;box-shadow:none;background:none;display:flex;flex-wrap:wrap;gap:1rem;align-items:end}
.adm form .field{flex:1;min-width:14rem}
.adm .row{display:flex;flex-wrap:wrap;gap:.8rem 1rem;align-items:center}
.adm .status{margin:.6rem 0 0;font-style:italic;color:var(--ink-soft)}.adm .status.err{color:var(--rubric)}
.winner{text-align:center;border-top:3px solid var(--gold)}
.winner .nm{font-size:clamp(1.8rem,5vw,2.4rem);color:var(--lapis-deep);margin:.3rem 0 0}
.winner .em{font-size:1.3rem;margin:.2rem 0 0;word-break:break-all}
.adm table{width:100%;border-collapse:collapse;font-size:1.1rem}
.adm th{font-variant-caps:all-small-caps;letter-spacing:.1em;text-align:left;color:var(--ink-soft);font-weight:500;border-bottom:1px solid var(--stone-deep);padding:.3rem .4rem}
.adm td{padding:.4rem;border-bottom:1px solid var(--stone-deep);overflow-wrap:break-word}.adm td:nth-child(3){overflow-wrap:anywhere}.adm td:first-child{width:2rem}
.adm tr.drawn td{color:var(--ink-soft);background:rgba(184,145,58,.12)}
.adm .tag{white-space:nowrap;font-variant-caps:all-small-caps;letter-spacing:.08em;color:var(--rubric)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="adm">
<p class="rubric">St. Cecilia &middot; Christmas Walk</p>
<h1>Raffle drawing</h1>
<p class="sub">Private page. Not linked from the site.</p>

<section class="panel" id="login">
<form id="login-form"><div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div><button class="btn btn-red" type="submit">Open</button></form>
<p class="status" id="login-status" role="status"></p>
</section>

<div id="app" hidden>
<section class="panel">
<div class="row"><button class="btn btn-red" id="draw" type="button">Draw a winner</button><button class="btn btn-plain" id="csv" type="button">Download entries (CSV)</button><button class="btn btn-plain" id="reload" type="button">Refresh</button></div>
<p class="status" id="app-status" role="status"></p>
</section>
<section class="panel winner" id="winner-panel" hidden aria-live="polite"><p class="rubric" id="winner-label">Winner</p><p class="nm" id="w-name"></p><p class="em" id="w-email"></p><p class="status" id="w-note"></p></section>
<section class="panel"><h2 style="margin:0 0 .6rem;font-size:1.5rem" id="count">Entries</h2><table><thead><tr><th>#</th><th>Name</th><th>Email</th><th></th></tr></thead><tbody id="rows"></tbody></table></section>
</div>
</main>
<script>
(function(){
var pw='',ep='/api/admin/raffle';
var $=function(i){return document.getElementById(i)};
function say(el,msg,err){el.textContent=msg;el.className='status'+(err?' err':'')}
function api(opts){opts=opts||{};opts.headers=Object.assign({'x-admin-password':pw},opts.headers||{});opts.cache='no-store';return fetch(ep+(opts.q||''),opts)}
function render(d){
  var order={};d.draws.forEach(function(x,i){order[x.entry_id]=i+1});
  $('count').textContent=d.entries.length+' entr'+(d.entries.length===1?'y':'ies')+(d.total>d.entries.length?' ('+(d.total-d.entries.length)+' repeat email'+(d.total-d.entries.length===1?'':'s')+' ignored)':'');
  var tb=$('rows');tb.textContent='';
  d.entries.forEach(function(e,i){var tr=document.createElement('tr');if(order[e.id])tr.className='drawn';
    [i+1,e.name,e.email,order[e.id]?(order[e.id]===1?'Winner':'Alternate '+(order[e.id]-1)):''].forEach(function(v,j){var td=document.createElement('td');if(j===3&&v)td.className='tag';td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});
}
function load(){return api().then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})}).then(render)}
$('login-form').addEventListener('submit',function(e){e.preventDefault();pw=$('pw').value;say($('login-status'),'Checking…');
  load().then(function(){$('login').hidden=true;$('app').hidden=false;$('pw').value=''}).catch(function(j){pw='';say($('login-status'),(j&&j.error)||'Could not connect.',true)})});
$('reload').addEventListener('click',function(){say($('app-status'),'');load().catch(function(j){say($('app-status'),(j&&j.error)||'Could not refresh.',true)})});
$('draw').addEventListener('click',function(){var b=$('draw');b.disabled=true;say($('app-status'),'Drawing…');
  api({method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'draw'})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})}).then(function(j){
    var first=$('winner-panel').hidden&&!document.querySelector('tr.drawn');
    $('winner-panel').hidden=false;$('winner-label').textContent=first?'Winner':'Alternate';$('w-name').textContent=j.winner.name;$('w-email').textContent=j.winner.email;
    $('w-note').textContent=j.remaining+' entr'+(j.remaining===1?'y':'ies')+' left to draw from. Draw again for an alternate.';say($('app-status'),'');return load()
  }).catch(function(j){say($('app-status'),(j&&j.error)||'Could not draw.',true)}).then(function(){b.disabled=false})});
$('csv').addEventListener('click',function(){say($('app-status'),'');api({q:'?format=csv'}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(bl){
  var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='christmas-walk-raffle-entries.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}).catch(function(){say($('app-status'),'Could not download.',true)})});
})();
</script>
</body>
</html>
